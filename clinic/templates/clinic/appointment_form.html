{% extends 'layout.html' %} {% load i18n %} {% block title %}{% trans 'Book Appointment' %}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:720px">
  <h2 class="mb-4"><i class="bi bi-calendar-plus me-2"></i>{% trans 'Book Appointment' %}</h2>
  <form method="post" class="card card-body">{% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">{% trans 'Facility' %}</label>
        <select name="facility" class="form-select" required>
          {% for f in facilities %}<option value="{{ f.pk }}">{{ f.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">{% trans 'Patient' %}</label>
        <select name="patient" class="form-select" required>
          {% for p in patients %}<option value="{{ p.pk }}">{{ p.mrn }} — {{ p }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">{% trans 'Provider' %}</label>
        <input name="provider" class="form-control" placeholder="{% trans 'User ID (optional)' %}">
      </div>
      <div class="col-md-6">
        <label class="form-label">{% trans 'Room / Station' %}</label>
        <select name="room" class="form-select">
          <option value="">—</option>
          {% for d in devices %}<option value="{{ d.pk }}">{{ d.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-5">
        <label class="form-label">{% trans 'Start (YYYY-MM-DD HH:MM)' %}</label>
        <input name="start_datetime" class="form-control" placeholder="2026-10-12 09:00" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">{% trans 'Minutes' %}</label>
        <input type="number" name="duration_minutes" value="20" min="5" class="form-control">
      </div>
      <div class="col-md-4">
        <label class="form-label">{% trans 'Department' %}</label>
        <input name="department" class="form-control">
      </div>
      <div class="col-12">
        <label class="form-label">{% trans 'Reason' %}</label>
        <textarea name="reason" rows="2" class="form-control"></textarea>
      </div>
    </div>
    <div class="mt-3"><button class="btn btn-primary">{% trans 'Book' %}</button>
      <a class="btn btn-link" href="{% url 'clinic:appointment_list' %}">{% trans 'Cancel' %}</a></div>
  </form>
</div>
{% endblock %}
