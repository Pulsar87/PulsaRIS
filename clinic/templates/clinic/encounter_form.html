{% extends 'layout.html' %} {% load i18n %} {% block title %}{% trans 'New Encounter' %}{% endblock %}
{% block content %}
<div class="container py-4">
  <h2 class="mb-4"><i class="bi bi-stethoscope me-2"></i>{% trans 'New Encounter' %}</h2>
  <form method="post" class="card p-4">{% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">{% trans 'Patient' %} *</label>
        <select name="patient" class="form-select" required>
          <option value="">—</option>
          {% for p in patients %}<option value="{{ p.pk }}">{{ p }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">{% trans 'Facility' %} *</label>
        <select name="facility" class="form-select" required>
          {% for f in facilities %}<option value="{{ f.pk }}">{{ f.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">{% trans 'Provider (optional)' %}</label>
        <input type="text" name="provider" class="form-control" placeholder="{% trans 'User ID' %}">
      </div>
      <div class="col-md-12">
        <label class="form-label">{% trans 'Reason / chief complaint' %}</label>
        <textarea name="reason" rows="2" class="form-control"></textarea>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary">{% trans 'Create Encounter' %}</button>
      <a href="{% url 'clinic:encounter_list' %}" class="btn btn-outline-secondary ms-2">{% trans 'Cancel' %}</a>
    </div>
  </form>
</div>
{% endblock %}
