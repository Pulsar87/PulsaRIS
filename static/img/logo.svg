<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Raqeem logo: stone slab with primitive binary engravings.
       Colors adapt to the app's light/dark mode via CSS variables in custom.css. -->
  <g fill="var(--logo-slab, #111111)">
    <!-- Irregular Prehistoric Stone Slab Outer Silhouette -->
    <path d="M 120,60 
             C 160,50 210,55 250,65 
             C 290,75 310,80 325,110 
             C 340,140 335,170 330,200 
             C 325,230 290,245 250,250 
             C 210,255 150,245 120,235 
             C 90,225 75,200 70,160 
             C 65,120 80,70 120,60 Z" />
  </g>

  <!-- Engraved Primitive Digits chiseled manually into the stone (Rough, imperfect lines) -->
  <g fill="none" stroke="var(--logo-engrave, #ffffff)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Row 1: 1 1 0 1 -->
    <!-- Chiseled '1': Primitive uneven slashes with slight organic tilt -->
    <path d="M 136,98 L 134,117 M 130,103 L 136,98" />
    <path d="M 167,99 L 163,116 M 161,104 L 167,99" />
    <!-- Chiseled '0': Rough, uneven polygonal outline simulating a carved circle -->
    <path d="M 190,102 L 202,99 L 205,112 L 192,116 L 188,107 Z" />
    <path d="M 226,97 L 227,116" />
    <path d="M 258,100 L 254,118 M 251,105 L 258,100" />

    <!-- Row 2: 0 1 1 0 1 -->
    <path d="M 112,138 L 125,134 L 128,147 L 115,149 Z" />
    <path d="M 149,133 L 151,152" />
    <path d="M 179,136 L 177,151" />
    <path d="M 203,137 L 216,135 L 219,146 L 206,149 Z" />
    <path d="M 242,133 L 239,150" />
    <path d="M 264,136 L 275,139 L 273,151 L 261,148 Z" />

    <!-- Row 3: 1 0 1 1 0 -->
    <path d="M 134,171 L 135,189" />
    <path d="M 158,172 L 171,169 L 173,183 L 160,185 Z" />
    <path d="M 197,168 L 194,187" />
    <path d="M 225,170 L 226,186" />
    <path d="M 249,173 L 260,170 L 263,184 L 251,186 Z" />

    <!-- Row 4: 0 1 0 1 -->
    <path d="M 145,208 L 156,205 L 159,219 L 147,221 Z" />
    <path d="M 182,204 L 179,223" />
    <path d="M 206,207 L 218,209 L 215,222 L 203,220 Z" />
    <path d="M 241,205 L 243,221" />
  </g>
</svg>
