services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ris_db
      POSTGRES_USER: ris_user
      POSTGRES_PASSWORD: ris_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ris_user -d ris_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
    - redisdata:/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    # Load .env file automatically
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    volumes:
      - .:/app:z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
    # Internal-only reachability of the Orthanc REST API (orthanc:8042).
    # Deliberately NO depends_on orthanc: Django must start even when the
    # PACS archive is briefly unavailable (Phase 1 Task 1.1).
    networks:
      - default
      - pacs

  celery:
      build: .
      # Remove the entrypoint if it forces a specific shell behavior that conflicts
      entrypoint: []
      command: python -m celery -A config worker -l info
      environment:
        - DJANGO_SETTINGS_MODULE=config.settings.dev
        - PYTHONPATH=/app
      volumes:
        - .:/app:z
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_started
        web:
          condition: service_started
      # Sync worker (Phase 2) calls Orthanc REST internally; no depends_on so
      # Celery starts even if the archive is briefly down (jobs retry).
      networks:
        - default
        - pacs

  dicom-server:
    build:
      context: .
      dockerfile: Dockerfile.dicom
    # Load .env file automatically
    env_file:
      - .env
    ports:
      - "11112:11112"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - PYTHONPATH=/app
    # No code volume mount here
    command: python manage.py run_dicom_server --host 0.0.0.0 --port 11112
    volumes:
      - .:/app:z
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────
  # PACS Phase 1 (Task 1.1): dedicated DICOM archive — Orthanc.
  # Separate service from Django/Gunicorn/Celery and from the MWL SCP above
  # (RIS_SCP stays on 11112 untouched). Pinned image; production deployments
  # must additionally pin the immutable digest (@sha256:...).
  # Config is rendered at start from ORTHANC_* env vars (deploy/orthanc/
  # docker-entrypoint.sh) so AE titles, credentials and the sender allowlist
  # live in .env/secrets, never in Git. See deploy/orthanc/orthanc-sample.json.
  # REST/DICOMweb (8042) are deliberately NOT published to the host: reachable
  # only on the internal `pacs` network (Django/celery join it).
  # ─────────────────────────────────────────────────────────────────────────
  orthanc:
    image: orthancteam/orthanc
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/ris-orthanc/docker-entrypoint.sh"]
    command: ["Orthanc", "${ORTHANC_CONFIG_DIR:-/var/lib/orthanc/db/ris-config}/orthanc.json"]
    env_file:
      - .env
    environment:
      RUNTIME_CONFIG: ${RUNTIME_CONFIG:-1}
      ORTHANC_NAME: ${ORTHANC_NAME:-PulsaRIS-PACS}
      ORTHANC_AE_TITLE: ${ORTHANC_AE_TITLE:-PULSAR_PACS}
      ORTHANC_DICOM_PORT: ${ORTHANC_DICOM_PORT:-4242}
      ORTHANC_REST_PORT: ${ORTHANC_REST_PORT:-8042}
      ORTHANC_DB_DIR: /var/lib/orthanc/db
      ORTHANC_CONFIG_DIR: /var/lib/orthanc/db/ris-config
      # Secrets — required, no defaults (compose fails fast if unset).
      ORTHANC_RIS_USER: ${ORTHANC_RIS_USER:?set ORTHANC_RIS_USER in .env}
      ORTHANC_RIS_PASSWORD: ${ORTHANC_RIS_PASSWORD:?set ORTHANC_RIS_PASSWORD in .env}
      ORTHANC_ADMIN_USER: ${ORTHANC_ADMIN_USER:-pacs-admin}
      ORTHANC_ADMIN_PASSWORD: ${ORTHANC_ADMIN_PASSWORD:?set ORTHANC_ADMIN_PASSWORD in .env}
      # Approved senders "AE:IPv4,AE:IPv4"; empty = deny all (default policy).
      ORTHANC_ALLOWED_SENDERS: ${ORTHANC_ALLOWED_SENDERS:-}
      ORTHANC_MAX_CONCURRENT_CONNECTIONS: ${ORTHANC_MAX_CONCURRENT_CONNECTIONS:-16}
      ORTHANC_LIMIT_QUERIES: ${ORTHANC_LIMIT_QUERIES:-512}
      ORTHANC_LIMIT_METADATA_BYTES: ${ORTHANC_LIMIT_METADATA_BYTES:-16777216}
    ports:
      # DICOM Storage SCP for modalities. Bind to the LAN/VPN interface via
      # ORTHANC_DICOM_BIND_IP (e.g. 10.20.0.5); default 127.0.0.1 keeps it
      # local until the firewall/network review for real devices is done.
      - "${ORTHANC_DICOM_BIND_IP:-127.0.0.1}:${ORTHANC_DICOM_PORT:-4242}:${ORTHANC_DICOM_PORT:-4242}"
      # NOTE: no mapping for ${ORTHANC_REST_PORT} — REST stays internal-only.
    volumes:
      - orthanc-db:/var/lib/orthanc/db            # original DICOM objects + index (persistent)
      - ./deploy/orthanc/docker-entrypoint.sh:/opt/ris-orthanc/docker-entrypoint.sh:ro,z
      - ./deploy/orthanc/healthcheck.sh:/opt/ris-orthanc/healthcheck.sh:ro,z
    networks:
      - pacs
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/ris-orthanc/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  static_volume:
  orthanc-db:   # PACS object storage + index — back up as a pair with the DB

networks:
  # Private service network for RIS <-> Orthanc REST traffic (Phase 2 sync
  # worker). Modalities never touch this; they speak DICOM to port 4242 only.
  pacs:
    driver: bridge
