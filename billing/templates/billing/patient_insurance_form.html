{% extends 'layout.html' %}
{% load i18n %}

{% block title %}{% trans 'Patient Insurance' %}{% endblock %}

{% block content %}
<div class="container-fluid">
    <h1>{% trans 'Patient Insurance' %}</h1>

    <div class="card">
        <div class="card-body">
            <form method="post" class="form">
                {% csrf_token %}

                <div class="form-group">
                    <label>{{ form.payer.label }}</label>
                    {{ form.payer }}
                </div>

                <div class="form-group">
                    <label>{{ form.policy_number.label }}</label>
                    {{ form.policy_number }}
                </div>

                <div class="form-group">
                    <label>{{ form.group_number.label }}</label>
                    {{ form.group_number }}
                </div>

                <div class="form-group">
                    <label>{{ form.effective_date.label }}</label>
                    {{ form.effective_date }}
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary">{% trans 'Save' %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
