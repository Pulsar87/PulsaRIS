{% extends 'layout.html' %}
{% load i18n %}

{% block title %}{% trans 'Authorization' %}{% endblock %}

{% block content %}
<div class="container-fluid">
    <h1>{% trans 'Authorization' %}</h1>

    <div class="card">
        <div class="card-body">
            <form method="post" class="form">
                {% csrf_token %}

                <div class="form-group">
                    <label>{{ form.auth_number.label }}</label>
                    {{ form.auth_number }}
                </div>

                <div class="form-group">
                    <label>{{ form.auth_type.label }}</label>
                    {{ form.auth_type }}
                </div>

                <div class="form-group">
                    <label>{{ form.valid_from.label }}</label>
                    {{ form.valid_from }}
                </div>

                <div class="form-group">
                    <label>{{ form.valid_until.label }}</label>
                    {{ form.valid_until }}
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary">{% trans 'Save' %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
